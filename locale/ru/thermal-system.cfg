[mod-setting-description]
update-quota=Количество объектов, которые тепловая система будет пытаться обновить за один игровой тик. Чрезвычайно высокие значения существенно повлияют на производительность.\nСлишком низкие значения приведут к непредсказуемому или даже деструктивному поведению.\n\nПонижайте этот параметр только при возникновении проблем с производительностью.

